<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skattetabell Visualizer</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="skattetabell_data.js"></script>
    <style>
        :root {
            --primary: #4fc3f7;
            --primary-hover: #29b6f6;
            --bg-color: #1a1a1a;
            --card-bg: #2c2c2c;
            --text-main: #e0e0e0;
            --text-muted: #bbb;
            --border-color: #444;
            --accent-1: #4fc3f7; /* Blue */
            --accent-2: #81c784; /* Green */
            --accent-3: #ce93d8; /* Purple */
            --accent-4: #ffcc80; /* Orange */
            --accent-5: #ff8a65; /* Red/Orange */
            --accent-6: #b2ff59; /* Lime */
        }

        select option {
            background-color: var(--card-bg);
            color: var(--text-main);
        }

        body {
            font-family: sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            box-sizing: border-box;
        }

        header {
            margin-bottom: 1rem;
        }

        h1 {
            color: var(--primary);
            border-bottom: 1px solid #555;
            padding-bottom: 10px;
            margin-top: 0;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-top: 0.5rem;
        }

        .main-content {
            display: flex;
            flex-direction: row;
            gap: 2rem;
            align-items: flex-start;
        }

        @media (max-width: 900px) {
            .main-content {
                flex-direction: column;
            }
        }

        .chart-container {
            flex: 3;
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            height: 600px;
            position: relative;
            width: 100%;
        }

        .controls-container {
            flex: 1;
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            width: 100%;
            min-width: 300px;
            box-sizing: border-box;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .control-group h3 {
            margin: 0;
            font-size: 1rem;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.25rem;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            cursor: pointer;
            margin-top: 0.5rem;
        }

        .checkbox-wrapper input[type="checkbox"] {
            appearance: none;
            background-color: var(--bg-color);
            margin: 0;
            font: inherit;
            color: currentColor;
            width: 1.25em;
            height: 1.25em;
            border: 2px solid var(--border-color);
            border-radius: 0.25em;
            display: grid;
            place-content: center;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }

        .checkbox-wrapper input[type="checkbox"]::before {
            content: "";
            width: 0.65em;
            height: 0.65em;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em var(--text-main);
            background-color: transform;
            transform-origin: center;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }

        .checkbox-wrapper input[type="checkbox"]:checked {
            background-color: var(--primary);
            border-color: var(--primary);
        }

        .checkbox-wrapper input[type="checkbox"]:checked::before {
            transform: scale(1);
        }

        .checkbox-label {
            font-size: 0.9rem;
            color: var(--text-main);
            user-select: none;
            transition: color 0.2s;
        }

        .checkbox-wrapper:hover .checkbox-label {
            color: white;
        }

        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }

        .setting-input {
            width: 80px;
            background: transparent;
            border: none;
            color: var(--primary);
            font-weight: bold;
            text-align: right;
            font-size: 0.85rem;
            outline: none;
            font-family: inherit;
        }
        .setting-input:focus {
            border-bottom: 1px solid var(--primary);
        }

        .nav-link { color: var(--primary); text-decoration: none; font-weight: bold; display: inline-block; margin-bottom: 15px; }
        .nav-link:hover { text-decoration: underline; color: #81c784; }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .input-group label {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .input-group input[type="range"] {
            width: 100%;
            cursor: pointer;
        }

        select, input[type="number"].full-width {
            width: 100%;
            padding: 0.5rem;
            background: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 0.9rem;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="nav-link">← Tillbaka till översikten</a>
    <header>
        <h1>Skattetabell Visualizer</h1>
        <p class="subtitle">Interaktiv visualisering av Skatteverkets allmänna tabeller (Månadslön 2026)</p>
    </header>

    <div class="main-content">
        <div class="controls-container">
            <div class="control-group">
                <h3>Din Inkomst</h3>
                <div class="input-group" style="margin-top: 0.5rem;">
                    <label for="user-income">Månadslön (kr)</label>
                    <input type="number" id="user-income" class="full-width" placeholder="t.ex. 35000">
                </div>
                <div id="income-results" style="margin-top: 0.75rem; font-size: 0.95rem; line-height: 1.4;">
                </div>
            </div>
        </div>

        <div class="chart-container">
            <canvas id="tabellChart"></canvas>
        </div>

        <div class="controls-container">
            <div class="control-group">
                <h3>Urval</h3>
                
                <div style="margin-top: 0.5rem;">
                    <label style="font-size: 0.8rem; color: var(--text-muted); display: block; margin-bottom: 0.25rem;">Skattetabell (Grupp)</label>
                    <select id="group-select" class="full-width"></select>
                </div>

                <div style="margin-top: 0.5rem;" id="col-checkboxes">
                    <label style="font-size: 0.8rem; color: var(--text-muted); display: block; margin-bottom: 0.25rem;">Kolumner</label>
                    <label class="checkbox-wrapper" style="margin-top: 0.25rem;">
                        <input type="checkbox" value="0" class="col-check" checked>
                        <span class="checkbox-label" style="color: #4fc3f7;">1: Lön (Under 66 år)</span>
                    </label>
                    <label class="checkbox-wrapper" style="margin-top: 0.25rem;">
                        <input type="checkbox" value="1" class="col-check" checked>
                        <span class="checkbox-label" style="color: #81c784;">2: Pension (66+ år)</span>
                    </label>
                    <label class="checkbox-wrapper" style="margin-top: 0.25rem;">
                        <input type="checkbox" value="2" class="col-check" checked>
                        <span class="checkbox-label" style="color: #ce93d8;">3: Lön (66+ år)</span>
                    </label>
                    <label class="checkbox-wrapper" style="margin-top: 0.25rem;">
                        <input type="checkbox" value="3" class="col-check" checked>
                        <span class="checkbox-label" style="color: #ffcc80;">4: Sjuk-/Aktivitetsersättning</span>
                    </label>
                    <label class="checkbox-wrapper" style="margin-top: 0.25rem;">
                        <input type="checkbox" value="4" class="col-check" checked>
                        <span class="checkbox-label" style="color: #ff8a65;">5: A-kassa/Sjukpenning</span>
                    </label>
                    <label class="checkbox-wrapper" style="margin-top: 0.25rem;">
                        <input type="checkbox" value="5" class="col-check" checked>
                        <span class="checkbox-label" style="color: #b2ff59;">6: Pension/Ersättning</span>
                    </label>
                </div>

                <label class="checkbox-wrapper">
                    <input type="checkbox" id="show-percent" checked>
                    <span class="checkbox-label">Visa som procent (%) av lön</span>
                </label>
            </div>

            <div class="control-group" style="margin-top: 1rem;">
                <h3>Inställningar</h3>
                <div class="input-group" style="margin-top: 0.5rem;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.1rem;">
                        <label for="x-axis-max-val">Max Månadsinkomst (kr)</label>
                        <input type="number" id="x-axis-max-val" class="setting-input" value="100000" step="5000">
                    </div>
                    <input type="range" id="x-axis-max" min="10000" max="200000" step="5000" value="100000">
                </div>

                <div style="margin-top: 1rem;" id="y-axis-settings">
                    <label style="font-size: 0.8rem; color: var(--text-muted); display: block; margin-bottom: 0.25rem;">Y-axel Max (vid %-vy)</label>
                    <select id="y-axis-max-percent" class="full-width">
                        <option value="60">60% (Standard)</option>
                        <option value="100">100% (Hela skalan)</option>
                        <option value="auto">Auto (Zooma till data)</option>
                    </select>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Färgpalett för de 6 kolumnerna
    const lineColors = [
        '#4fc3f7', // Kolumn 1: Lön under 66
        '#81c784', // Kolumn 2: Pension 66+
        '#ce93d8', // Kolumn 3: Lön 66+
        '#ffcc80', // Kolumn 4: Sjuk/Aktivitet under 66
        '#ff8a65', // Kolumn 5: A-kassa/Sjukpenning under 66
        '#b2ff59'  // Kolumn 6: Pension/Ersättning under 66
    ];

    const colNames = [
        "Kolumn 1: Lön (Under 66 år)",
        "Kolumn 2: Pension (66+ år)",
        "Kolumn 3: Lön (66+ år)",
        "Kolumn 4: Sjuk-/Aktivitetsersättning (Under 66 år)",
        "Kolumn 5: A-kassa/Sjukpenning (Under 66 år)",
        "Kolumn 6: Pension/Ersättning (Under 66 år)"
    ];

    // SKATTETABELL_DATA laddas från skattetabell_data.js
    const groups = Object.keys(SKATTETABELL_DATA).sort((a, b) => {
        // Enkel sortering, nummer först och eventuellt B-varianter
        return a.localeCompare(b, 'sv', {numeric: true});
    });

    const groupSelect = document.getElementById('group-select');
    groups.forEach(g => {
        const option = document.createElement('option');
        option.value = g;
        option.text = g.includes('B') ? g.replace('B', '#') : g;
        groupSelect.appendChild(option);
    });
    
    // Förvald grupp
    if (groups.includes('30B33')) {
        groupSelect.value = '30B33';
    } else if (groups.includes('30')) {
        groupSelect.value = '30';
    } else {
        groupSelect.value = groups[0];
    }

    const verticalLinePlugin = {
        id: 'verticalLine',
        afterDraw: (chart, args, options) => {
            const incomeInput = document.getElementById('user-income');
            if (!incomeInput) return;
            const income = parseFloat(incomeInput.value);
            if (isNaN(income) || income <= 0) return;

            const xAxis = chart.scales.x;
            const yAxis = chart.scales.y;
            
            if (income >= xAxis.min && income <= xAxis.max) {
                const x = xAxis.getPixelForValue(income);
                const ctx = chart.ctx;
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(x, yAxis.top);
                ctx.lineTo(x, yAxis.bottom);
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#ffffff'; 
                ctx.setLineDash([5, 5]);
                ctx.stroke();
                ctx.restore();
            }
        }
    };

    const ctx = document.getElementById('tabellChart').getContext('2d');
    let chart = new Chart(ctx, {
        type: 'line',
        plugins: [verticalLinePlugin],
        data: {
            labels: [],
            datasets: []
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: {
                mode: 'index',
                intersect: false,
            },
            plugins: {
                legend: {
                    labels: { color: '#e0e0e0', font: { family: 'sans-serif', size: 13 } }
                },
                tooltip: {
                    backgroundColor: 'rgba(44, 44, 44, 0.9)',
                    titleColor: '#e0e0e0',
                    bodyColor: '#e0e0e0',
                    borderColor: '#444',
                    borderWidth: 1,
                    padding: 12,
                    callbacks: {
                        title: function(context) {
                            return 'Månadsinkomst: ' + new Intl.NumberFormat('sv-SE').format(context[0].parsed.x) + ' kr';
                        },
                        label: function(context) {
                            let label = context.dataset.label || '';
                            if (label) label += ': ';
                            const showPercent = document.getElementById('show-percent').checked;
                            if (context.parsed.y !== null) {
                                if (showPercent) {
                                    label += context.parsed.y.toFixed(1) + '%';
                                } else {
                                    label += new Intl.NumberFormat('sv-SE').format(context.parsed.y) + ' kr';
                                }
                            }
                            return label;
                        }
                    }
                }
            },
            scales: {
                x: {
                    type: 'linear',
                    grid: { color: '#444444', drawBorder: false },
                    ticks: {
                        color: '#bbbbbb',
                        callback: function(value) { return value / 1000 + 'k'; },
                        font: { family: 'sans-serif' }
                    },
                    title: { display: true, text: 'Månadsinkomst (kr)', color: '#e0e0e0', font: { family: 'sans-serif', size: 14 } },
                    min: 0
                },
                y: {
                    type: 'linear',
                    display: true,
                    position: 'left',
                    grid: { color: '#444444', drawBorder: false },
                    ticks: {
                        color: '#bbbbbb',
                        font: { family: 'sans-serif' }
                    },
                    title: { display: true, text: 'Skatt', color: '#e0e0e0', font: { family: 'sans-serif', size: 14 } },
                    min: 0
                }
            }
        }
    });

    function updateChart() {
        const group = document.getElementById('group-select').value;
        const colCheckboxes = document.querySelectorAll('.col-check');
        const activeCols = Array.from(colCheckboxes).filter(cb => cb.checked).map(cb => parseInt(cb.value, 10));
        const showPercent = document.getElementById('show-percent').checked;
        const maxX = parseInt(document.getElementById('x-axis-max').value, 10);

        const groupData = SKATTETABELL_DATA[group];
        if (!groupData) return;

        const datasets = [];
        
        for (let i = 0; i < 6; i++) {
            if (!activeCols.includes(i)) {
                continue; // Hoppa över om kolumnen inte är ikryssad
            }

            const dataPoints = [];
            for (let j = 0; j < groupData.x.length; j++) {
                const xVal = groupData.x[j];
                let yVal = groupData.cols[i][j];
                
                if (xVal > maxX * 1.5) continue; // Rendera inte onödigt långt bortom max X
                
                if (showPercent) {
                    yVal = xVal > 0 ? (yVal / xVal) * 100 : 0;
                }
                
                dataPoints.push({ x: xVal, y: yVal });
            }

            datasets.push({
                label: colNames[i],
                borderColor: lineColors[i],
                backgroundColor: lineColors[i] + '20',
                borderWidth: 2,
                pointRadius: 0,
                fill: false,
                data: dataPoints,
                tension: 0.1
            });
        }

        chart.data.datasets = datasets;
        chart.options.scales.x.max = maxX;
        
        const yAxisSettingsDiv = document.getElementById('y-axis-settings');
        
        if (showPercent) {
            yAxisSettingsDiv.style.display = 'block';
            chart.options.scales.y.title.text = 'Skatt (%)';
            chart.options.scales.y.ticks.callback = function(value) { return value + '%'; };
            const yMaxSetting = document.getElementById('y-axis-max-percent').value;
            if (yMaxSetting === 'auto') {
                chart.options.scales.y.max = undefined;
            } else {
                chart.options.scales.y.max = parseInt(yMaxSetting, 10);
            }
        } else {
            yAxisSettingsDiv.style.display = 'none';
            chart.options.scales.y.title.text = 'Skatt (kr)';
            chart.options.scales.y.ticks.callback = function(value) { return value / 1000 + 'k'; };
            chart.options.scales.y.max = undefined; // Auto
        }

        chart.update();

        // Uppdatera "Din Inkomst" resultat
        const incomeInput = document.getElementById('user-income');
        if (incomeInput) {
            const income = parseFloat(incomeInput.value);
            const resultsDiv = document.getElementById('income-results');
            if (!isNaN(income) && income > 0) {
                let closestJ = 0;
                let minDiff = Infinity;
                for (let j = 0; j < groupData.x.length; j++) {
                    const diff = Math.abs(groupData.x[j] - income);
                    if (diff < minDiff) {
                        minDiff = diff;
                        closestJ = j;
                    }
                }
                
                let resultsHtml = '';
                activeCols.forEach(colIdx => {
                    const yVal = groupData.cols[colIdx][closestJ];
                    const percent = ((yVal / income) * 100).toFixed(1);
                    const netto = income - yVal;
                    resultsHtml += `<div style="margin-bottom: 0.5rem; padding: 0.5rem; background: var(--bg-color); border-radius: 4px; border-left: 3px solid ${lineColors[colIdx]};">
                        <strong style="color: ${lineColors[colIdx]}">${colNames[colIdx].split(':')[0]}:</strong><br>
                        Skatt: ${new Intl.NumberFormat('sv-SE').format(yVal)} kr (${percent}%)<br>
                        Netto: ${new Intl.NumberFormat('sv-SE').format(netto)} kr
                    </div>`;
                });
                if (activeCols.length === 0) {
                    resultsHtml = '<span style="color: var(--text-muted);">Välj minst en kolumn.</span>';
                }
                resultsDiv.innerHTML = resultsHtml;
            } else {
                resultsDiv.innerHTML = '<span style="color: var(--text-muted);">Ange en månadslön för att se skatt.</span>';
            }
        }

        saveSettings();
    }

    function loadSettings() {
        const settingsStr = localStorage.getItem('skattetabellSettings');
        if (settingsStr) {
            try {
                const settings = JSON.parse(settingsStr);
                if (settings.group && groups.includes(settings.group)) document.getElementById('group-select').value = settings.group;
                if (settings.showPercent !== undefined) document.getElementById('show-percent').checked = settings.showPercent;
                if (settings.xAxisMax) {
                    document.getElementById('x-axis-max').value = settings.xAxisMax;
                    document.getElementById('x-axis-max-val').value = settings.xAxisMax;
                }
                if (settings.yAxisMaxPercent) document.getElementById('y-axis-max-percent').value = settings.yAxisMaxPercent;
                if (settings.userIncome) document.getElementById('user-income').value = settings.userIncome;
                if (settings.activeCols && Array.isArray(settings.activeCols)) {
                    document.querySelectorAll('.col-check').forEach(cb => {
                        cb.checked = settings.activeCols.includes(parseInt(cb.value, 10));
                    });
                }
            } catch (e) {
                console.error("Kunde inte läsa inställningar från localStorage", e);
            }
        }
    }

    function saveSettings() {
        const settings = {
            group: document.getElementById('group-select').value,
            showPercent: document.getElementById('show-percent').checked,
            xAxisMax: document.getElementById('x-axis-max').value,
            yAxisMaxPercent: document.getElementById('y-axis-max-percent').value,
            userIncome: document.getElementById('user-income') ? document.getElementById('user-income').value : '',
            activeCols: Array.from(document.querySelectorAll('.col-check')).filter(cb => cb.checked).map(cb => parseInt(cb.value, 10))
        };
        localStorage.setItem('skattetabellSettings', JSON.stringify(settings));
    }

    // Event listeners
    document.getElementById('group-select').addEventListener('change', updateChart);
    document.querySelectorAll('.col-check').forEach(cb => cb.addEventListener('change', updateChart));
    document.getElementById('show-percent').addEventListener('change', updateChart);
    document.getElementById('y-axis-max-percent').addEventListener('change', updateChart);
    
    const incomeInputEl = document.getElementById('user-income');
    if (incomeInputEl) {
        incomeInputEl.addEventListener('input', updateChart);
    }
    
    document.getElementById('x-axis-max').addEventListener('input', function(e) {
        document.getElementById('x-axis-max-val').value = e.target.value;
        updateChart();
    });
    document.getElementById('x-axis-max-val').addEventListener('change', function(e) {
        document.getElementById('x-axis-max').value = e.target.value;
        updateChart();
    });

    // Starta
    loadSettings();
    updateChart();
</script>
</body>
</html>
